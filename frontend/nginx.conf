# frontend/nginx.conf

# Анти-abuse на уровне прокси: DRF-троттлинг считает уже аутентифицированных,
# а эти лимиты держат и анонимный перебор /auth/, и флуд handshake'ами.
# Ключ — $binary_remote_addr, поэтому за дополнительным прокси считать IP надо
# через real_ip (иначе все клиенты попадут в один бакет).
# 8m ≈ 110k адресов по ~70 байт на зону.
limit_req_zone $binary_remote_addr zone=api:8m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:8m;
# По умолчанию 503, а фронт ждёт 429 (тот же ответ, что у DRF-троттлинга)
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: все несуществующие пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API на Django backend
    location /api/ {
        # burst без nodelay растягивал бы пик на секунды и тормозил чат
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси WebSocket на Django backend
    location /ws/ {
        # На соединение, а не на кадр: limit_req здесь считал бы каждый запрос,
        # а нам нужен параллельный шторм подключений
        limit_conn ws_conn 10;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # Держим WS-соединение до 24ч
        proxy_send_timeout 86400s;
    }
}
